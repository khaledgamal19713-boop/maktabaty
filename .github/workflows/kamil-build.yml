name: Build Kamil reader

on:
  push:
    branches: [main]
    paths:
      - 'tools/kamil/**'
      - 'kamil.html'
      - 'js/kamil.js'
      - 'css/kamil.css'
      - '.github/workflows/kamil-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and extract source
        run: bash tools/kamil/build-source.sh
      - name: Parse
        run: |
          python3 tools/kamil/parser.py             --input build/kamil/text/book.txt             --output build/kamil/book.json             --overrides tools/kamil/overrides.json
      - name: Validate gates
        run: |
          python3 tools/kamil/validate.py             --book build/kamil/book.json             --gold tools/kamil/gold.json             --report build/kamil/report.json
      - name: Assemble reader data
        run: |
          mkdir -p artifacts/kamil
          cp build/kamil/book.json artifacts/kamil/
          cp build/kamil/report.json artifacts/kamil/
          cp build/kamil/source/quality.json artifacts/kamil/
          cp build/kamil/source/SHA256.txt artifacts/kamil/
          cp tools/kamil/gold.json artifacts/kamil/
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: kamil-build-evidence
          path: artifacts/kamil/
